[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xhs-copy-eval"
version = "0.1.0"
description = "Reproducible Chinese social-copy evaluation with automatic metrics, LLM-as-Judge, and bad-case attribution."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.6"]
data = ["datasets>=3", "evaluate>=0.4", "pandas>=2.2", "rouge-score>=0.1.2", "sacrebleu>=2.4"]
lm-eval-api = ["lm_eval[api]>=0.4.9"]
lm-eval-hf = ["lm_eval[hf]>=0.4.9"]
lm-eval-vllm = ["lm_eval[vllm]>=0.4.9"]

[project.scripts]
xhs-eval = "xhs_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_eval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

